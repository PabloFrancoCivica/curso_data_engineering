sources:

  - name: google_sheets
    description: >
      Datos cargados desde Google Sheets, utilizados como fuente externa de presupuestos mensuales.
    schema: google_sheets
    database: "{{ env_var('DBT_ENVIRONMENTS') }}_BRONZE_DB"

    quoting:
      database: false
      schema: false
      identifier: false

    freshness:
      #warn_after: {count: 24, period: hour}
      #error_after: {count: 48, period: hour}

    tables:
      - name: budget
        description: >
          Presupuestos mensuales estimados por producto.
        loaded_at_field: _fivetran_synced
        columns:
          - name: _row
            description: >
              Clave primaria técnica de la fila en Google Sheets.
            tests:
              - unique
              - not_null

          - name: product_id
            description: >
              Identificador del producto presupuestado.
            tests:
              - not_null

          - name: quantity
            description: >
              Cantidad presupuestada del producto para ese mes.
            tests:
              - not_null
              - positive_values 

          - name: month
            description: >
              Mes correspondiente al presupuesto.
            tests:
              - not_null

          - name: _fivetran_synced
            description: >
              Fecha de sincronización del dato mediante Fivetran.
            tests:
              - not_null
