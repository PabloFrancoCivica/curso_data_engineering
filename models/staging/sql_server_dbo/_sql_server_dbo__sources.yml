sources:

  - name: sql_server_dbo 
    description: >
      Datos transaccionales provenientes del sistema SQL Server original.
    schema: sql_server_dbo 
    database: ALUMNO26_DEV_BRONZE_DB 

    quoting:
      database: false
      schema: false
      identifier: false

    freshness:
      warn_after: {count: 1000, period: day}
      #error_after: {count: 48, period: hour}

    tables:
      - name: addresses
        description: >
          Direcciones asociadas a usuarios y pedidos.
        columns:
          - name: address_id
            tests:
              - unique
              - not_null
          - name: zipcode
            data_type: number
          - name: country
            data_type: varchar
          - name: address
            data_type: varchar
          - name: state
            data_type: varchar
          - name: _fivetran_deleted
            data_type: boolean
          - name: _fivetran_synced
            data_type: timestamp_tz

      - name: events
        description: >
          Eventos de interacción de los usuarios en la plataforma (clics, vistas, etc.).
        columns:
          - name: event_id
            data_type: varchar
            tests:
              - unique
              - not_null
          - name: page_url
            data_type: varchar
          - name: event_type
            data_type: varchar
          - name: user_id
            data_type: varchar
          - name: product_id
            data_type: varchar
          - name: session_id
            data_type: varchar
          - name: created_at
            data_type: timestamp_ntz
          - name: order_id
            data_type: varchar
          - name: _fivetran_deleted
            data_type: boolean
          - name: _fivetran_synced
            data_type: timestamp_tz

      - name: order_items
        description: >
          Detalle de productos incluidos en cada pedido.
        columns:
          - name: order_id
            data_type: varchar
            tests:
              - not_null
          - name: product_id
            data_type: varchar
            tests:
              - not_null
          - name: quantity
            data_type: number
          - name: _fivetran_deleted
            data_type: boolean
          - name: _fivetran_synced
            data_type: timestamp_tz

      - name: orders
        description: >
          Pedidos realizados por los usuarios.
        columns:
          - name: order_id
            data_type: varchar
            tests:
              - unique
              - not_null
          - name: shipping_service
            data_type: varchar
          - name: shipping_cost
            data_type: float
          - name: address_id
            data_type: varchar
          - name: created_at
            data_type: timestamp_tz
          - name: promo_id
            data_type: varchar
          - name: estimated_delivery_at
            data_type: timestamp_tz
          - name: order_cost
            data_type: float
          - name: user_id
            data_type: varchar
          - name: order_total
            data_type: float
          - name: delivered_at
            data_type: timestamp_tz
          - name: tracking_id
            data_type: varchar
          - name: status
            data_type: varchar
          - name: _fivetran_deleted
            data_type: boolean
          - name: _fivetran_synced
            data_type: timestamp_tz

      - name: products
        description: >
          Productos disponibles en la plataforma.
        columns:
          - name: product_id
            data_type: varchar
            tests:
              - unique
              - not_null
          - name: price
            data_type: float
          - name: name
            data_type: varchar
          - name: inventory
            data_type: number
          - name: _fivetran_deleted
            data_type: boolean
          - name: _fivetran_synced
            data_type: timestamp_tz

      - name: promos
        description: >
          Promociones aplicables a los pedidos.
        columns:
          - name: promo_id
            data_type: varchar
            tests:
              - unique
              - not_null
          - name: discount
            data_type: number
          - name: status
            data_type: varchar
          - name: _fivetran_deleted
            data_type: boolean
          - name: _fivetran_synced
            data_type: timestamp_tz

      - name: users
        description: >
          Usuarios registrados en la plataforma.
        columns:
          - name: user_id
            data_type: varchar
            tests:
              - unique
              - not_null
          - name: updated_at
            data_type: timestamp_tz
          - name: address_id
            data_type: varchar
          - name: last_name
            data_type: varchar
          - name: created_at
            data_type: timestamp_tz
          - name: phone_number
            data_type: varchar
          - name: total_orders
            data_type: number
          - name: first_name
            data_type: varchar
          - name: email
            data_type: varchar
          - name: _fivetran_deleted
            data_type: boolean
          - name: _fivetran_synced
            data_type: timestamp_tz